# XcodeGen-Spezifikation (macOS):  brew install xcodegen && cd iosApp && xcodegen generate && open ChargeShare.xcodeproj
# Das Kotlin-Framework "ComposeApp" wird vor jedem Build per Gradle gebaut und eingebunden.
# HINWEIS: Auf Linux nicht verifizierbar (iOS baut nur auf macOS mit Xcode).
name: ChargeShare
options:
  bundleIdPrefix: app.chargeshare
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ""   # eigene Team-ID eintragen
packages:
  # Stripe iOS SDK (PaymentSheet inkl. Apple Pay). Stand: Oktober 2026 = 26.12.1
  Stripe:
    url: https://github.com/stripe/stripe-ios-spm
    from: 26.12.1
targets:
  ChargeShare:
    type: application
    platform: iOS
    sources:
      - path: ChargeShare
    info:
      path: ChargeShare/Info.plist
      properties:
        CFBundleDisplayName: ChargeShare
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Rueckkehr-URL fuer Stripe-Authentifizierungen mit Weiterleitung
        CFBundleURLTypes:
          - CFBundleURLName: app.chargeshare
            CFBundleURLSchemes: [chargeshare]
    dependencies:
      - package: Stripe
        product: StripePaymentSheet
    # Apple-Pay-Capability: braucht ein bezahltes Apple-Developer-Konto und die Merchant-ID (siehe README, „Zahlung“).
    # Mit einem kostenlosen Konto schlaegt das Signieren fuer Geraete fehl: dann diesen entitlements-Block entfernen
    # (Apple Pay entfaellt, Kartenzahlung bleibt).
    entitlements:
      path: ChargeShare/ChargeShare.entitlements
      properties:
        com.apple.developer.in-app-payments:
          - merchant.app.chargeshare   # ersetzen durch die eigene Merchant-ID (muss zu APPLE_PAY_MERCHANT_ID passen)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.chargeshare
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "ComposeApp"]
    preBuildScripts:
      - name: Build Kotlin framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
