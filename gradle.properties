org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g
android.useAndroidX=true
android.nonTransitiveRClass=true
# Android-Target an/aus: auto (SDK vorhanden) | true | false
# chargeshare.android=false
# iOS-Targets: nur auf macOS aktiv. Auf Linux erzwingen (nur Metadaten): chargeshare.ios=true
# chargeshare.ios=true
# iOS-Targets auf Linux nur Metadaten; Tasks wie iosSimulatorArm64Test stilllegen
kotlin.native.ignoreDisabledTargets=true
