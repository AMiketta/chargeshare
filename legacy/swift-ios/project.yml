name: ChargeShare
options:
  bundleIdPrefix: de.chargeschare
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: CHARGESHARETEAM
    PRODUCT_BUNDLE_IDENTIFIER: de.chargeschare.app
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  ChargeShare:
    type: application
    platform: iOS
    sources:
      - path: ChargeShare
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: ChargeShare/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: ChargeShare/ChargeShare.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: ChargeShare/Resources/Info.plist
      properties:
        NSLocationWhenInUseUsageDescription: "ChargeShare benötigt deinen Standort, um Wallboxen in deiner Nähe zu finden."
        NSLocationAlwaysAndWhenInUseUsageDescription: "ChargeShare benötigt deinen Standort für Ladestatistiken."
        CFBundleDisplayName: ChargeShare
        UILaunchScreen:
          UIColorName: ChargeShareGreen
    scheme:
      testTargets:
        - ChargeShareTests

  ChargeShareTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ChargeShareTests
    dependencies:
      - target: ChargeShare
